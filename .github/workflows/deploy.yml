name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into config.js
        run: |
          python - <<'PY'
          import os, re
          path = 'config.js'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          for token, env in {
              '__SUPABASE_URL__': 'SUPABASE_URL',
              '__SUPABASE_ANON_KEY__': 'SUPABASE_ANON_KEY',
              '__ADMIN_PASSWORD_HASH__': 'ADMIN_PASSWORD_HASH',
          }.items():
              content = content.replace(token, os.environ.get(env, ''))
          # Bersihkan placeholder yang tersisa (kalau secret tidak di-set) — HANYA token yang dikenal,
          # jangan sentuh __INVITATION_CONFIG__ (identifier asli di file ini)
          for leftover in ['__SUPABASE_URL__', '__SUPABASE_ANON_KEY__', '__ADMIN_PASSWORD_HASH__']:
              content = content.replace(leftover, '')
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          name: github-pages
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
